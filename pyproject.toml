[project]
name = "pdf-extractext"
version = "1.4.0"
description = "PDF extraction API with 3-layer architecture"
readme = "README.md"
# Misma version de Python que el orquestador, en local y en la imagen
# (12-Factor X: paridad entre entornos).
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.34.0",
    "pymongo>=4.10.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.20",
    "pypdfium2>=5.8.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "httpx2>=1.0.0",
    "mongomock>=4.3.0",
    "black>=26.3.0",
    "flake8>=7.2.0",
    "mypy>=1.20.1",
    "isort>=8.0.1",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88

[tool.isort]
# Perfil "black" para que isort y black no se contradigan al ordenar imports.
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.14"
files = ["app"]
# Se corrigen las anotaciones en vez de silenciar errores: sin type: ignore
# ni cast() de conveniencia. Las librerias sin stubs no rompen el chequeo.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
