# Prometheus del perfil "monitoreo" del stack del TP: lee las metricas de
# Traefik (requests por codigo, latencias, conexiones y reintentos).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # Metricas propias de cada replica (GET /metrics): cola, rechazos por motivo
  # y tiempo de extraccion. El DNS de Docker devuelve una IP por replica.
  - job_name: extract
    dns_sd_configs:
      - names: ["extract"]
        type: A
        port: 8000
        refresh_interval: 5s
