# Pipeline de calidad. Corre en cada push a main y en cada PR:
#   1. formato y lint (black, isort, flake8) y tipos (mypy)
#   2. tests (pytest, con mongomock: no necesita MongoDB)
#   3. build de la imagen Docker y smoke test de /health y POST /extract
#   4. escaneo de secretos en el historial (trufflehog)
#   5. convencion de commits en PRs: tipo(#N): descripcion, con (#N) opcional
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad-y-tests:
    name: Calidad y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra dev
      - name: black
        run: uv run black --check app tests main.py
      - name: isort
        run: uv run isort --check-only app tests main.py
      - name: flake8
        run: uv run flake8 app tests main.py
      - name: mypy
        run: uv run mypy app main.py
      - name: pytest
        run: uv run pytest -q

  docker:
    name: Build Docker y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f docker/Dockerfile -t pdf-extractext:ci .
      - name: Smoke test de /health y POST /extract (modo solo extraccion)
        run: |
          docker run -d --rm --name extract -p 8000:8000 \
            -e DOCUMENTS_API_ENABLED=false pdf-extractext:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS -H "Content-Type: application/pdf" \
            --data-binary "@tests/stress/pdfs/2020-Scrum-Guide-Spanish-Latin-South-American.pdf" \
            http://127.0.0.1:8000/extract -o respuesta.json
          python3 -c "import json; r = json.load(open('respuesta.json')); assert r['page_count'] == 16, r['page_count']; print('page_count', r['page_count'])"
      - if: always()
        run: docker logs extract || true
      - if: always()
        run: docker stop extract || true

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  commits:
    name: Convencion de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Verificar formato tipo(#N): descripcion"
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|ci|build|perf|style)(\(#[0-9]+\))?: .+'
          fallos=0
          while IFS= read -r msg; do
            if [[ "$msg" =~ $pattern ]]; then echo "OK   $msg"; else echo "MAL  $msg"; fallos=1; fi
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $fallos
