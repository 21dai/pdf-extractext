services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pdf-extractext-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-PDF Extract API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_NAME: ${DATABASE_NAME:-pdf_extract}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-3000}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-10485760}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      API_DOCS_URL: ${API_DOCS_URL:-/docs}
      API_REDOC_URL: ${API_REDOC_URL:-/redoc}
      API_OPENAPI_URL: ${API_OPENAPI_URL:-/openapi.json}
    networks:
      - pdf_extract_network

networks:
  pdf_extract_network:
    name: pdf_extract_network
