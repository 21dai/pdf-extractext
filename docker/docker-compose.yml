# Una sola instancia de la API para desarrollo, publicada en el puerto local.
# No necesita base de datos: el servicio solo extrae (ADR-0008).
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Mismo nombre de imagen que el stack del TP y el repo infrastructure.
    image: pdf-extractext:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    # El mismo PORT del .env es el puerto del host y el del contenedor.
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      APP_NAME: ${APP_NAME:-PDF Extract API}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      DEBUG: ${DEBUG:-False}
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-10485760}
      API_DOCS_URL: ${API_DOCS_URL:-/docs}
      API_REDOC_URL: ${API_REDOC_URL:-/redoc}
      API_OPENAPI_URL: ${API_OPENAPI_URL:-/openapi.json}
