# Los mismos controles de formato y lint que el CI, antes de cada commit.
# Usan las versiones del uv.lock (uv run), asi no hay dos configuraciones.
#
#   uv sync --extra dev
#   uv run pre-commit install        # una vez por clon
#   uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
