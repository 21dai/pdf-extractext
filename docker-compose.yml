# Stack del TP de carga y estres: Traefik + 5 replicas de POST /extract.
#
#   docker compose up --build
#
# Autocontenido: no necesita MongoDB ni los otros repos del proyecto. Las
# replicas corren con DOCUMENTS_API_ENABLED=false (solo /extract, sin estado).
# El stack completo (orquestador + CRUD + MongoDB) esta en el repo
# infrastructure; usa los mismos puertos, asi que no levantar los dos a la vez.
#
#   POST http://127.0.0.1/extract                     (Vegeta)
#   POST https://extract.universidad.localhost/extract  (k6; certificado
#        autofirmado de Traefik: usar --insecure-skip-tls-verify)
#   Dashboard de Traefik: http://localhost:8080/dashboard/
#   Monitoreo (opcional): docker compose --profile monitoreo up -d
name: pdf-extractext-tp

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Metricas en formato Prometheus en :8080/metrics (perfil monitoreo).
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.buckets=0.1,0.5,1,2.5,5,10,20,30"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  extract:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pdf-extractext:${IMAGE_TAG:-1.3.2}
    restart: unless-stopped
    # Ante SIGTERM, uvicorn deja de aceptar conexiones y termina lo que tiene
    # en cola. Un request admitido espera hasta EXTRACT_MAX_WAIT_SECONDS, asi
    # que se le da ese tiempo mas un margen antes de que Docker mande SIGKILL.
    stop_grace_period: ${STOP_GRACE_PERIOD:-35s}
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DOCUMENTS_API_ENABLED: "false"
      # Un proceso por replica: con 1 CPU de limite, mas procesos compiten
      # por el mismo nucleo (a medir en la Fase 2 del plan).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      MAX_PDF_SIZE_BYTES: 10485760
      # Backpressure: espera maxima con la que se admite un request (ver README).
      EXTRACT_MAX_WAIT_SECONDS: ${EXTRACT_MAX_WAIT_SECONDS:-28}
      EXTRACT_MAX_PENDING: ${EXTRACT_MAX_PENDING:-60}
    deploy:
      # Maximo que permite la consigna del TP.
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Una sola aplicacion detras del proxy: todo el trafico va a las replicas.
      - "traefik.http.routers.extract.rule=PathPrefix(`/`)"
      - "traefik.http.routers.extract.entrypoints=web"
      - "traefik.http.routers.extract-tls.rule=PathPrefix(`/`)"
      - "traefik.http.routers.extract-tls.entrypoints=websecure"
      - "traefik.http.routers.extract-tls.tls=true"
      - "traefik.http.services.extract.loadbalancer.server.port=8000"
      # Estrategia de balanceo: wrr (round robin), p2c (de dos replicas al azar,
      # la de menos requests en vuelo) o leasttime (la que responde mas rapido).
      - "traefik.http.services.extract.loadbalancer.strategy=${LB_STRATEGY:-wrr}"
      # Si una replica se cae o se esta apagando, Traefik reintenta en otra.
      # Es seguro porque /extract no tiene estado: procesar dos veces el mismo
      # PDF no cambia nada (prueba de caos en docs/INFORME-TP.md).
      - "traefik.http.middlewares.reintento.retry.attempts=3"
      - "traefik.http.middlewares.reintento.retry.initialinterval=100ms"
      - "traefik.http.routers.extract.middlewares=reintento"
      - "traefik.http.routers.extract-tls.middlewares=reintento"

  # Perfil "monitoreo" (opcional): no se levanta con un "up" comun para no
  # sacarle CPU a las replicas durante las mediciones.
  #   docker compose --profile monitoreo up -d
  #   Grafana: http://localhost:3000 (dashboard "TP - POST /extract")
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoreo"]
    restart: unless-stopped
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    image: grafana/grafana:12.0.0
    profiles: ["monitoreo"]
    restart: unless-stopped
    environment:
      # Solo para uso local: el dashboard se ve sin iniciar sesion.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/extract.json
    volumes:
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
